<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla JS Calculator</title>

    <!-- link stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- link JavaScript file -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- represents the whole calculator -->
    <main>
      <!-- represents the display -->
      <div></div>
      <!-- represents the input area, i.e. the buttons -->
      <div class="buttons">
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button>0</button>
        <button>*</button>
        <button>/</button>
        <button>=</button>
        <button>+</button>
        <button>-</button>
      </div>
    </main>
  </body>
</html>
